name: Build Test Windows Binary

on:
  push:
    branches:
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build lyssna.exe
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
      - run: npm ci
      - run: npm run build
      - name: Build lyssna (release)
        # Plain verbosity: -vv also prints every dependency's own warnings.
        run: cargo build --release --locked --bin lyssna
      - name: Upload lyssna.exe
        uses: actions/upload-artifact@v4
        with:
          name: lyssna-windows-exe
          path: target/release/lyssna.exe
